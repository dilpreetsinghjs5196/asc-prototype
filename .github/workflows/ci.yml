name: CI Quality Gate

on:
  push:
    branches: [ main, phases-work ]
  pull_request:
    branches: [ main ]

jobs:
  gate:
    name: Lint & Build Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static Analysis (ESLint)
        run: npm run lint

      - name: Production Bundle Build (Vite)
        run: npm run build
